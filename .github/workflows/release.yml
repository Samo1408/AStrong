name: Release

# Tag a version (e.g. `git tag v1.0.3 && git push origin v1.0.3`) and this
# builds the installable zips on GitHub's runners and attaches them to the
# release. They are produced from source here — never uploaded by hand.
#
# One tag ships both release lines, both built from this tree:
#   AlwaysStrong-<ver>.zip         PlayIntegrityFork
#   AlwaysStrong-<ver>-inject.zip  PlayIntegrityFix inject-s

on:
  push:
    tags:
      - 'v*'
  # Also runnable from the Actions tab (or the API) against a tag ref, for when
  # a tag-push event doesn't fire the run on its own. Dispatched on a tag,
  # github.ref_name is that tag, so every step below behaves the same as a push.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing git tag to build/release (for example v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Use committed native binaries (skip the cargo-ndk step in CI)
        # native/*/prebuilt/<abi>/* are committed; touching them newer than the
        # sources makes build.sh package them as-is instead of needing Rust+NDK.
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +

      - name: Build both module zips
        run: bash build.sh

      - name: Release notes from CHANGELOG
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          awk -v v="## $tag" '
            $0==v {f=1; next}
            /^## / {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- notes -----"; cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: out/AlwaysStrong-*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Point the update manifests at this release
        # Installed modules poll update.json / update-inject.json, so they have
        # to name a release that already exists — hence this runs after publish.
        # Never fails the release: a bad push here costs an edit, not the build.
        continue-on-error: true
        run: |
          set -eu
          tag="${{ inputs.release_tag || github.ref_name }}"
          git fetch --no-tags origin +refs/heads/main:refs/heads/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" main; then
            echo "::notice::tag $tag is not on main — leaving the manifests alone"
            exit 0
          fi
          git checkout main
          # both lines carry the same version — module/module.prop defines it once
          ver=$(sed -n 's/^version=//p' module/module.prop)
          code=$(sed -n 's/^versionCode=//p' module/module.prop)
          write_manifest() {
            printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/%s",\n  "changelog": "https://raw.githubusercontent.com/%s/main/CHANGELOG.md"\n}\n' \
              "$ver" "$code" "$GITHUB_REPOSITORY" "$tag" "$2" "$GITHUB_REPOSITORY" > "$1"
          }
          fork_zip=$(cd out && ls AlwaysStrong-*.zip | grep -v -- '-inject' | head -1)
          inj_zip=$(cd out && ls AlwaysStrong-*-inject.zip 2>/dev/null | head -1 || true)
          write_manifest update.json "$fork_zip"
          [ -n "$inj_zip" ] && write_manifest update-inject.json "$inj_zip"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json update-inject.json
          git diff --cached --quiet && { echo "manifests already current"; exit 0; }
          git commit -m "chore: point update manifests at $tag"
          git push origin main
